# Nginx reverse proxy for AgentStudio (agentstudio.tech)
# Install to /etc/nginx/sites-available/agentstudio.conf and symlink into
# sites-enabled — see DEPLOY.md. Certbot rewrites the TLS parts on first run.

# Redirect all HTTP to HTTPS (certbot manages the certificates)
server {
    listen 80;
    listen [::]:80;
    server_name agentstudio.tech www.agentstudio.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://agentstudio.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agentstudio.tech www.agentstudio.tech;

    # Managed by certbot (paths created by `certbot --nginx`)
    ssl_certificate /etc/letsencrypt/live/agentstudio.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentstudio.tech/privkey.pem;

    # Canonical host: www → apex
    if ($host = www.agentstudio.tech) {
        return 301 https://agentstudio.tech$request_uri;
    }

    # Hardening
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    # Long-lived cache for Next.js immutable assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming chat: disable buffering so tokens reach the client live
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # WebSocket upgrade (Clerk dev tools, future realtime features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
