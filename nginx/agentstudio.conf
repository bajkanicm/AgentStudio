# Nginx reverse proxy for AgentStudio (agentstudio.tech)
# This is the config deployed at /etc/nginx/sites-available/agentstudio.tech
# on the production VPS (nginx 1.22 — use `listen 443 ssl http2;`, the
# standalone `http2 on;` directive needs nginx ≥ 1.25).
# The previous static-site vhost is backed up at /root/agentstudio.tech.nginx.backup-*

server {
    listen 80;
    listen [::]:80;
    server_name agentstudio.tech www.agentstudio.tech;

    # Certbot webroot renewals (path referenced by /etc/letsencrypt/renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/agentstudio/acme;
        allow all;
    }

    location / {
        return 301 https://agentstudio.tech$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agentstudio.tech www.agentstudio.tech;

    ssl_certificate /etc/letsencrypt/live/agentstudio.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentstudio.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Canonical host: www → apex
    if ($host = www.agentstudio.tech) {
        return 301 https://agentstudio.tech$request_uri;
    }

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    # Long-lived cache for Next.js immutable assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming chat: no buffering so tokens reach the client live
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
